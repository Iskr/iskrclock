<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- IskrCLOCK: an alarm clock on the night-sky blue of the app -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3160"/>
      <stop offset="1" stop-color="#171b38"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g fill="none" stroke="#f2c98c" stroke-width="30" stroke-linecap="round">
    <!-- bells -->
    <path d="M118 150 A80 80 0 0 1 206 92"/>
    <path d="M394 150 A80 80 0 0 0 306 92"/>
    <!-- face -->
    <circle cx="256" cy="286" r="150"/>
    <!-- legs -->
    <path d="M150 414 L120 452"/>
    <path d="M362 414 L392 452"/>
  </g>
  <!-- hands -->
  <g fill="none" stroke="#f4f3f8" stroke-width="26" stroke-linecap="round">
    <path d="M256 286 L256 196"/>
    <path d="M256 286 L320 326"/>
  </g>
  <circle cx="256" cy="286" r="16" fill="#f4f3f8"/>
</svg>
